spring:
  datasource:
    url: jdbc:h2:mem:comissao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0/realms/teste
          jwk-set-uri: http://localhost:0/realms/teste/certs
app:
  storage:
    diretorio: target/test-storage
  ia:
    api-key: ""
